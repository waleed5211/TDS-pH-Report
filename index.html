<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boiler TDS & pH Report Generator</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- html2canvas Library for Image Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.25);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            --accent-color: #007AFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 40%, #415a77 70%, #11998e 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Liquid Glass Card Container */
        .glass-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 40px;
            width: 100%;
            max-width: 520px;
            box-shadow: var(--glass-shadow);
            transform: translateY(0);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .glass-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .glass-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 45px 0 rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 0.3px;
        }

        /* Custom Styling for Selection Checkbox */
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            user-select: none;
        }

        .checkbox-container input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #007AFF;
            cursor: pointer;
        }

        .input-group input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input[type="number"]:focus {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .input-group input[type="number"]::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn-download {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #007AFF 0%, #00C6FF 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 122, 255, 0.4);
            transition: all 0.3s ease;
        }

        .btn-download:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 25px rgba(0, 122, 255, 0.6);
        }

        .btn-download:active {
            transform: scale(0.98);
        }

        /* Hidden Template Box Specifically For Image Capture */
        #report-template-wrapper {
            position: absolute;
            left: -9999px;
            top: -9999px;
        }

        #report-template {
            width: 600px;
            background-color: #ffffff;
            color: #000000;
            padding: 40px;
            font-family: 'Plus Jakarta Sans', Arial, sans-serif;
            box-sizing: border-box;
        }

        .report-title {
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            color: #111;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .report-meta {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #444;
        }

        .report-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        /* Clean Uniform Table Lines */
        .report-table th, .report-table td {
            border: 1px solid #777;
            padding: 12px 16px;
            text-align: left;
            font-size: 15px;
        }

        .report-table th {
            background-color: #f2f2f2;
            font-weight: 700;
            color: #000;
        }

        .report-table td {
            color: #222;
            font-weight: 500;
        }

        .report-table td:nth-child(2) {
            font-weight: 700;
        }
    </style>
</head>
<body>

    <!-- Liquid Glass UI Form -->
    <div class="glass-container">
        <h1>TDS / pH Data Entry</h1>
        
        <form id="data-form">
            <div class="input-group">
                <div class="label-row">
                    <label for="ro-tds">RO TDS</label>
                    <label class="checkbox-container">
                        <input type="checkbox" id="chk-ro-tds" checked> Include
                    </label>
                </div>
                <input type="number" id="ro-tds" step="any" placeholder="e.g. 50">
            </div>

            <div class="input-group">
                <div class="label-row">
                    <label for="ro-ph">RO pH</label>
                    <label class="checkbox-container">
                        <input type="checkbox" id="chk-ro-ph" checked> Include
                    </label>
                </div>
                <input type="number" id="ro-ph" step="any" placeholder="e.g. 6.8">
            </div>

            <div class="input-group">
                <div class="label-row">
                    <label for="feed-tds">Feed Tank TDS</label>
                    <label class="checkbox-container">
                        <input type="checkbox" id="chk-feed-tds" checked> Include
                    </label>
                </div>
                <input type="number" id="feed-tds" step="any" placeholder="e.g. 120">
            </div>

            <div class="input-group">
                <div class="label-row">
                    <label for="feed-ph">Feed Tank pH</label>
                    <label class="checkbox-container">
                        <input type="checkbox" id="chk-feed-ph" checked> Include
                    </label>
                </div>
                <input type="number" id="feed-ph" step="any" placeholder="e.g. 7.5">
            </div>

            <div class="input-group">
                <div class="label-row">
                    <label for="boiler-tds">Boiler TDS</label>
                    <label class="checkbox-container">
                        <input type="checkbox" id="chk-boiler-tds" checked> Include
                    </label>
                </div>
                <input type="number" id="boiler-tds" step="any" placeholder="e.g. 2500">
            </div>

            <div class="input-group">
                <div class="label-row">
                    <label for="boiler-ph">Boiler pH</label>
                    <label class="checkbox-container">
                        <input type="checkbox" id="chk-boiler-ph" checked> Include
                    </label>
                </div>
                <input type="number" id="boiler-ph" step="any" placeholder="e.g. 10.5">
            </div>

            <button type="button" class="btn-download" onclick="generateAndDownloadImage()">
                Generate & Download Image
            </button>
        </form>
    </div>

    <!-- Layout Hidden from Screen (Used purely for Image Rendering) -->
    <div id="report-template-wrapper">
        <div id="report-template">
            <div class="report-title">TDS/pH Report</div>
            <div class="report-meta">
                <span id="report-date">Date: --/--/----</span>
                <span id="report-time">Time: --:-- --</span>
            </div>
            <table class="report-table">
                <thead>
                    <tr>
                        <th>Parameter</th>
                        <th>Value</th>
                    </tr>
                </thead>
                <tbody id="report-table-body">
                    <!-- Dynamic Rows Will Be Generated Here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function generateAndDownloadImage() {
            // All available parameters configuration
            const parameters = [
                { chkId: 'chk-ro-tds', inputId: 'ro-tds', name: 'RO TDS' },
                { chkId: 'chk-ro-ph', inputId: 'ro-ph', name: 'RO pH' },
                { chkId: 'chk-feed-tds', inputId: 'feed-tds', name: 'Feed Tank TDS' },
                { chkId: 'chk-feed-ph', inputId: 'feed-ph', name: 'Feed Tank pH' },
                { chkId: 'chk-boiler-tds', inputId: 'boiler-tds', name: 'Boiler TDS' },
                { chkId: 'chk-boiler-ph', inputId: 'boiler-ph', name: 'Boiler pH' }
            ];

            const tbody = document.getElementById('report-table-body');
            tbody.innerHTML = ''; // Clear previous rows

            let hasSelected = false;

            // Generate rows only for selected checkboxes
            parameters.forEach(param => {
                const isChecked = document.getElementById(param.chkId).checked;
                if (isChecked) {
                    hasSelected = true;
                    const val = document.getElementById(param.inputId).value || '-';
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${param.name}</td>
                        <td>${val}</td>
                    `;
                    tbody.appendChild(tr);
                }
            });

            if (!hasSelected) {
                alert('Meharbani karke kam az kam ek parameter select karein!');
                return;
            }

            // Get current date
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            const dateStr = `${day}/${month}/${year}`;

            // Get current time (Without Seconds)
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            const hoursStr = String(hours).padStart(2, '0');
            const timeStr = `${hoursStr}:${minutes} ${ampm}`;

            // Set Date & Time into Template
            document.getElementById('report-date').innerText = `Date: ${dateStr}`;
            document.getElementById('report-time').innerText = `Time: ${timeStr}`;

            // Capture as Clean Sharp Image
            const element = document.getElementById('report-template');
            
            html2canvas(element, {
                scale: 2,
                backgroundColor: '#ffffff',
                useCORS: true,
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `TDS_pH_Report_${day}_${month}_${year}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
